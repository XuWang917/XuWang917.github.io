  rel="noopener noreferrer">Prof. Wenqi Zhang</a> and
  <a class="intro-advisor" href="https://person.zju.edu.cn/zhangxuhong"
  target="_blank" rel="noopener noreferrer">Prof. Xuhong Zhang</a>.
  <span class="intro-research-line">I am interested in
  <em>embodied intelligence</em>, <em>spatial intelligence</em>, and
  <em>world models</em>.</span>

