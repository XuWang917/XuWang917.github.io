intro: >-
  <span class="intro-greeting" aria-hidden="true">👋</span> Hi! I am
  <strong class="intro-name">Xu Wang (王旭)</strong>. I received my bachelor's
  degree from <span class="intro-school">Shandong University</span> and am
  pursuing a master's degree at the School of Software,
  <span class="intro-school">Zhejiang University</span>. I am supervised by
