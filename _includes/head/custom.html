{% include base_path %}

<!-- start custom head snippets -->

<!-- Academic typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Use the profile avatar as the browser and home-screen icon. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/profile-favicon-180.png?v=1"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/profile-favicon-32.png?v=1" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/profile-favicon-192.png?v=1" sizes="192x192"/>
<link rel="shortcut icon" type="image/png" href="{{ base_path }}/images/profile-favicon-32.png?v=1"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- end custom head snippets -->
